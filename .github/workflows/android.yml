name: Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Build and test core
        run: mvn -B -pl uenav-core -am install

      - name: Gluon Build
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          mvn -B -Pandroid -pl uenav-mobile gluonfx:build gluonfx:package
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Copy packages to staging
        run: |
          mkdir staging
          find uenav-mobile/target/gluonfx -name "*.apk" -exec cp {} staging \;
          find uenav-mobile/target/gluonfx -name "*.aab" -exec cp {} staging \;
          ls -l staging

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging