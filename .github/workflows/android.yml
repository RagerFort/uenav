name: Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Build and test core
        run: mvn -B -pl uenav-core -am install

      # The APK is signed with UENav's own key (GitHub secrets UENAV_KEYSTORE_BASE64 and UENAV_KEYSTORE_PASSWORD;
      # the key and its password are kept in ~/UENav/signing on the owner's PC). With the same key every time, a new
      # build installs over the old one and keeps the app's saved data. Without the secrets the build still works,
      # signed with a throwaway key (phones must then uninstall the old app first).
      # Gluon only uses a key file whose name ends in .jks or .keystore (otherwise it quietly signs with a debug key).
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.UENAV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/uenav-release.jks"
            echo "path=$RUNNER_TEMP/uenav-release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the UENav key"
          else
            echo "No UENAV_KEYSTORE_BASE64 secret: signing with a throwaway key"
          fi

      - name: Gluon Build
        run: |
          export ANDROID_SDK=$ANDROID_HOME
          SIGN=""
          if [ -n "$KEYSTORE_PATH" ]; then
            SIGN="-Dprovided.keystore.path=$KEYSTORE_PATH -Dprovided.keystore.password=$KEYSTORE_PASSWORD -Dprovided.key.alias=uenav -Dprovided.key.alias.password=$KEYSTORE_PASSWORD"
          fi
          mvn -B -Pandroid -pl uenav-mobile $SIGN gluonfx:build gluonfx:package
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.UENAV_KEYSTORE_PASSWORD }}

      - name: Copy packages to staging
        run: |
          mkdir staging
          find uenav-mobile/target/gluonfx -name "*.apk" -exec cp {} staging \;
          find uenav-mobile/target/gluonfx -name "*.aab" -exec cp {} staging \;
          ls -l staging
          # which key signed it (compare with ~/UENav/signing: SHA-256 66:EF:42:45...)
          "$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner" verify --print-certs staging/*.apk | grep -i "SHA-256" || true
          rm -f "$RUNNER_TEMP/uenav-release.jks"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging