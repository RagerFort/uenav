server.port=8080

# Optional settings file, so UENav Server.exe needs no environment variables. Create
# C:\Users\<you>\.uenav\server.properties (or ~/.uenav/server.properties) with lines such as
#   UENAV_DB_PASSWORD=your-mysql-password
#   UENAV_ADMIN_USER=admin          (first start only)
#   UENAV_ADMIN_PASSWORD=at-least-8 (first start only)
# Environment variables still work and win over this file.
spring.config.import=optional:file:${user.home}/.uenav/server.properties

# MySQL connection. Override with environment variables; never commit real passwords.
spring.datasource.url=${UENAV_DB_URL:jdbc:mysql://localhost:3306/uenav?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${UENAV_DB_USER:uenav_app}
spring.datasource.password=${UENAV_DB_PASSWORD:}

# Let the server start even when MySQL is down, so /api/health still works.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

# First admin account. Created only when the admin_account table is empty.
# Set UENAV_ADMIN_USER and UENAV_ADMIN_PASSWORD (at least 8 characters) for the first start.
uenav.admin.username=${UENAV_ADMIN_USER:}
uenav.admin.password=${UENAV_ADMIN_PASSWORD:}
uenav.admin.full-name=Campus administrator
