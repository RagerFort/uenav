server.port=8080

# Optional settings file, so UENav Server.exe needs no environment variables. Create
# C:\Users\<you>\.uenav\server.properties (or ~/.uenav/server.properties) with lines such as
#   UENAV_DB_PASSWORD=your-mysql-password
#   UENAV_ADMIN_USER=admin          (first start only)
#   UENAV_ADMIN_PASSWORD=at-least-8 (first start only)
# Environment variables still work and win over this file.
spring.config.import=optional:file:${user.home}/.uenav/server.properties

# Database: the server starts its own built-in MariaDB (MySQL compatible) on 127.0.0.1:3307 and loads the
# campus map the first time (D24, com.uenav.server.db). Its user is uenav_app with UENAV_DB_PASSWORD (made up on the
# first start if missing); UENAV_DB_PORT changes the port. Query it with MySQL Workbench, the mysql command or the
# "UENav SQL" window while the server runs.
# To use your own MySQL server instead, set UENAV_DB_URL (and UENAV_DB_USER / UENAV_DB_PASSWORD); the lines below
# are then used as they are. Never commit real passwords.
# Online through ngrok (D25): with UENAV_NGROK_URL=https://<name>.ngrok-free.dev the server starts ngrok itself
# (installed and logged in once) and stops it when it closes. UENAV_NGROK_PATH names ngrok.exe if needed.
logging.level.ch.vorburger=WARN
# its "exited with an error" when the database is closed with the window; start problems are reported by UENav itself
logging.level.ch.vorburger.exec.ManagedProcess=OFF
spring.datasource.url=${UENAV_DB_URL:jdbc:mysql://localhost:3306/uenav?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${UENAV_DB_USER:uenav_app}
spring.datasource.password=${UENAV_DB_PASSWORD:}

# Let the server start even when the database is down, so /api/health still works.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

# First admin account. Created only when the admin_account table is empty.
# Set UENAV_ADMIN_USER and UENAV_ADMIN_PASSWORD (at least 8 characters) for the first start.
uenav.admin.username=${UENAV_ADMIN_USER:}
uenav.admin.password=${UENAV_ADMIN_PASSWORD:}
uenav.admin.full-name=Campus administrator
